{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div style="max-width:420px;margin:48px auto;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="font-size:2.5rem;margin-bottom:8px;">👋</div>
    <h1 style="font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;">Create your account</h1>
    <p style="color:var(--muted);margin-top:6px;">Join Splitwise and start tracking expenses</p>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. aditya_123" required autofocus minlength="3" maxlength="80">
        <div class="form-hint">At least 3 characters, unique across all users.</div>
      </div>
      <div class="form-group">
        <label for="email">Gmail / Email</label>
        <input type="email" id="email" name="email" placeholder="you@gmail.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:4px;">
        Create Account
      </button>
    </form>
  </div>

  <p style="text-align:center;margin-top:20px;font-size:0.9rem;color:var(--muted);">
    Already have an account?
    <a href="{{ url_for('auth.login') }}" style="color:var(--accent);font-weight:700;">Sign in</a>
  </p>
</div>
{% endblock %}
