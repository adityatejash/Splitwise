{% extends "base.html" %}
{% block title %}Create Group{% endblock %}
{% block content %}

<a href="{{ url_for('groups.list_groups') }}" class="back-link">← Back to Groups</a>

<div style="max-width:500px;">
  <div class="page-header">
    <div>
      <div class="page-title">Create a New Group</div>
      <div class="page-subtitle">You'll be set as the admin automatically.</div>
    </div>
  </div>

  <div class="card">
    <form method="POST" action="{{ url_for('groups.create_group') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="name">Group Name *</label>
        <input type="text" id="name" name="name" placeholder="e.g. Goa Trip, Flat Mates, Office Lunch" required maxlength="100">
      </div>
      <div class="form-group">
        <label for="description">Description <span style="font-weight:400;color:var(--muted);">(optional)</span></label>
        <input type="text" id="description" name="description" placeholder="Short note about this group" maxlength="255">
      </div>
      <div style="display:flex;gap:12px;margin-top:4px;">
        <button type="submit" class="btn btn-primary">Create Group</button>
        <a href="{{ url_for('groups.list_groups') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
